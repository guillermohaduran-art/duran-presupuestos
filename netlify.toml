# Configuración de Netlify para la app de presupuestos
[build]
  publish = "."

# El service worker y la app se revisan siempre, así los cambios llegan enseguida a los teléfonos
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
